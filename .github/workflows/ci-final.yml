name: CI-CD final validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CI image
        run: docker build -f CI-CD-proj-final/Dockerfile -t iac-ci-tools:ci .

      - name: Run Terraform and Ansible checks
        run: docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/CI-CD-proj-final iac-ci-tools:ci make ci
